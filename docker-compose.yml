services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onibus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onibus}
      POSTGRES_DB: ${POSTGRES_DB:-onibus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onibus} -d ${POSTGRES_DB:-onibus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-onibus};Username=${POSTGRES_USER:-onibus};Password=${POSTGRES_PASSWORD:-onibus}"
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
